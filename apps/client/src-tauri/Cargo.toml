[package]
name = "agai-client"
version = "0.1.0"
edition = "2024"
[lib]
name = "agai_client"
crate-type = ["rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
agai-host-launch = { path = "../../../crates/host-launch" }
tauri = { version = "2", features = [] }
agai-protocol = { path = "../../../crates/protocol" }
serde = {version="1",features= ["derive"] }
serde_json = "1"
uuid = {version="1",features= ["v4"] }
[dev-dependencies]
tempfile = "3"
